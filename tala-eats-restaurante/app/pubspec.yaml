name: talaeats_restaurant
description: Tala Eats Restaurante - frontend premium conectado al backend productivo Tala Eats.
publish_to: 'none'
version: 0.7.7+47

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  image_picker: ^1.1.2
  shared_preferences: ^2.5.3
  path_provider: ^2.1.5
  http: ^1.5.0
  http_parser: ^4.1.2
  flutter_secure_storage: ^9.2.4
  # v0.5.15: «Usar mi ubicación» en la ubicación del establecimiento.
  url_launcher: ^6.3.1
  geolocator: '>=13.0.0 <15.0.0'

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
    - assets/fonts/OFL-Figtree.txt
    - assets/fonts/OFL-BricolageGrotesque.txt
  fonts:
    - family: Figtree
      fonts:
        - asset: assets/fonts/Figtree_400Regular.ttf
          weight: 400
        - asset: assets/fonts/Figtree_500Medium.ttf
          weight: 500
        - asset: assets/fonts/Figtree_600SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Figtree_700Bold.ttf
          weight: 700
        - asset: assets/fonts/Figtree_800ExtraBold.ttf
          weight: 800
    - family: Bricolage
      fonts:
        - asset: assets/fonts/BricolageGrotesque_600SemiBold.ttf
          weight: 600
        - asset: assets/fonts/BricolageGrotesque_700Bold.ttf
          weight: 700
        - asset: assets/fonts/BricolageGrotesque_800ExtraBold.ttf
          weight: 800
