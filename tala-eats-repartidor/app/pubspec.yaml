name: talaeats_driver
description: Tala Eats Repartidor - frontend Android-first del ecosistema Tala Eats.
publish_to: 'none'
version: 1.2.8+24

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.5.0
  http_parser: ^4.1.2
  flutter_secure_storage: ^9.2.4
  shared_preferences: ^2.5.3
  geolocator: ^14.0.2
  image_picker: ^1.1.2
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/branding/tala_eats_logo.png
