name: TALA EATS Usuarios | P0 pedido una sola vez (sin APK)

on:
  pull_request:
    branches: [main]
    paths:
      - 'tala-eats-usuarios/app/lib/**'
      - 'tala-eats-usuarios/app/test/**'
      - 'tala-eats-usuarios/app/tools/native/MainActivity.java'
      - '.github/workflows/users-order-contract-qa.yml'
  push:
    branches: [main]
    paths:
      - 'tala-eats-usuarios/app/lib/**'
      - 'tala-eats-usuarios/app/test/**'
      - '.github/workflows/users-order-contract-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: users-order-contract-${{ github.ref }}
  cancel-in-progress: true

# No signing, APK, runtime deployment, live PSP, token, Android device,
# Firebase or user data. The GitHub Actions app is Flutter-only QA.
jobs:
  users-order-contract:
    name: Flutter analyze + idempotent order tests (CI sintético)
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    defaults:
      run:
        working-directory: tala-eats-usuarios/app
    steps:
      - name: Checkout fuente privada
        uses: actions/checkout@v4
      - name: Flutter 3.47.6
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.6'
          channel: stable
          cache: true
      - name: Dependencias Flutter
        run: flutter pub get
      - name: Analisis estatico (sin APK)
        run: flutter analyze --no-fatal-infos
      - name: QA de doble toque y llave persistente durante reintentos
        run: flutter test --reporter=compact test/order_submission_guard_test.dart test/pending_checkout_recovery_test.dart test/priority_p0_order_contract_test.dart test/priority_p0_network_resilience_test.dart
