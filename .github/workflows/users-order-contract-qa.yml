name: TALA EATS Usuarios | P0 pedido + compilacion Android (sin publicar)

on:
  pull_request:
    branches: [main]
    paths:
      - 'tala-eats-usuarios/app/lib/**'
      - 'tala-eats-usuarios/app/test/**'
      - 'tala-eats-usuarios/app/tools/native/MainActivity.java'
      - 'tala-eats-usuarios/ci/bootstrap_android.py'
      - '.github/workflows/users-order-contract-qa.yml'
  push:
    branches: [main]
    paths:
      - 'tala-eats-usuarios/app/lib/**'
      - 'tala-eats-usuarios/app/test/**'
      - 'tala-eats-usuarios/app/tools/native/MainActivity.java'
      - 'tala-eats-usuarios/ci/bootstrap_android.py'
      - '.github/workflows/users-order-contract-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: users-order-contract-${{ github.ref }}
  cancel-in-progress: true

# No release signing, distributed APK, runtime deployment, live PSP, token, Android device,
# Firebase or user data. The GitHub Actions app is Flutter-only QA.
jobs:
  users-order-contract:
    name: Flutter analyze + tests + compilacion Android debug efimera
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    defaults:
      run:
        working-directory: tala-eats-usuarios/app
    steps:
      - name: Checkout fuente privada
        uses: actions/checkout@v4
      - name: Flutter 3.47.6
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.6'
          channel: stable
          cache: true
      - name: Dependencias Flutter
        run: flutter pub get
      - name: Analisis estatico (sin APK)
        run: flutter analyze --no-fatal-infos
      - name: QA de doble toque y llave persistente durante reintentos
        run: flutter test --reporter=compact test/order_submission_guard_test.dart test/priority_p0_order_contract_test.dart test/priority_p0_network_resilience_test.dart test/backend_customer_contracts_test.dart test/customer_markets_contract_test.dart
      - name: Todos los tests Flutter Usuarios
        run: flutter test --reporter=compact
      - name: Preparar scaffold nativo Android desde fuentes oficiales
        run: python3 ../ci/bootstrap_android.py --role usuarios
      - name: Compilar Java nativo y Flutter Android debug (efímero, sin publicar)
        timeout-minutes: 12
        run: flutter build apk --debug --no-pub
      - name: No subir ni distribuir APK
        run: |
          test -f build/app/outputs/flutter-apk/app-debug.apk
          echo 'NATIVE_ANDROID_DEBUG_COMPILE_PASS no signing release, no APK artifact, no deploy'

