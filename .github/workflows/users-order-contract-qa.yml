name: TALA EATS Usuarios | Full regresion + Android + backend read-only

on:
  pull_request:
    branches: [main]
    paths:
      - 'tala-eats-usuarios/app/lib/**'
      - 'tala-eats-usuarios/app/pubspec.yaml'
      - 'tala-eats-usuarios/app/test/**'
      - 'tala-eats-usuarios/app/tools/native/MainActivity.java'
      - 'tala-eats-usuarios/ci/bootstrap_android.py'
      - '.github/workflows/users-order-contract-qa.yml'
  push:
    branches: [main]
    paths:
      - 'tala-eats-usuarios/app/lib/**'
      - 'tala-eats-usuarios/app/pubspec.yaml'
      - 'tala-eats-usuarios/app/test/**'
      - 'tala-eats-usuarios/app/tools/native/MainActivity.java'
      - 'tala-eats-usuarios/ci/bootstrap_android.py'
      - '.github/workflows/users-order-contract-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: users-order-contract-${{ github.ref }}
  cancel-in-progress: true

# No release signing, distributed APK, runtime deployment, live PSP, token, Android device,
# Firebase or user data. The GitHub Actions app is Flutter-only QA.
jobs:
  users-order-contract:
    name: Flutter analyze + tests + compilacion Android debug efimera
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    defaults:
      run:
        working-directory: tala-eats-usuarios/app
    steps:
      - name: Checkout fuente privada
        uses: actions/checkout@v4
      - name: Flutter 3.47.6
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.6'
          channel: stable
          cache: true
      - name: Dependencias Flutter
        run: flutter pub get
      - name: Analisis estatico (sin APK)
        run: flutter analyze --no-fatal-infos
      - name: QA de doble toque y llave persistente durante reintentos
        run: flutter test --reporter=compact test/order_submission_guard_test.dart test/priority_p0_order_contract_test.dart test/priority_p0_network_resilience_test.dart test/backend_customer_contracts_test.dart test/customer_markets_contract_test.dart test/customer_native_push_contract_test.dart test/customer_model_full_integration_test.dart test/customer_ui_full_integration_widget_test.dart
      - name: "UX premium: Home y Buscar responsive (320-430 dp)"
        run: flutter test --reporter=compact test/premium_discovery_polish_test.dart
      - name: Contraste AA de marca y botones (sin APK)
        run: flutter test --reporter=compact test/premium_brand_contrast_test.dart
      - name: "UX compra: producto, carrito, checkout y pedidos 320-430 dp"
        run: flutter test --reporter=compact test/premium_purchase_responsive_test.dart
      - name: Android Back, offline y fallback de imagenes
        run: flutter test --reporter=compact test/android_back_offline_media_test.dart
      - name: "UI limpia y funcionalidades conservadas en 320-430 dp"
        run: flutter test --reporter=compact test/quiet_ui_regression_test.dart
      - name: "QA teclado y Reduce Motion: 320/360/390/430 dp"
        run: flutter test --reporter=compact test/customer_keyboard_reduced_motion_test.dart
      - name: Roboto explicito en AppBar, botones y avisos
        run: flutter test --reporter=compact test/android_roboto_theme_contract_test.dart
      - name: "Preparar Roboto e íconos Material para capturas legibles"
        shell: bash
        run: |
          set -euo pipefail
          # Test-only font, fetched from Google's official open-source collection.
          curl --fail --location --silent --show-error --retry 3 \
            "https://raw.githubusercontent.com/google/fonts/main/ofl/roboto/Roboto%5Bwdth%2Cwght%5D.ttf" \
            --output "$RUNNER_TEMP/tala-roboto-qa.ttf"
          test "$(stat -c%s "$RUNNER_TEMP/tala-roboto-qa.ttf")" -gt 10000
          FLUTTER_SDK="$(dirname "$(dirname "$(readlink -f "$(command -v flutter)")")")"
          MATERIAL_FONT="$(find "$FLUTTER_SDK" -name MaterialIcons-Regular.otf -print -quit)"
          test -n "$MATERIAL_FONT" && test -s "$MATERIAL_FONT"
          echo "TALA_VISUAL_ROBOTO_PATH=$RUNNER_TEMP/tala-roboto-qa.ttf" >> "$GITHUB_ENV"
          echo "TALA_VISUAL_MATERIAL_ICONS_PATH=$MATERIAL_FONT" >> "$GITHUB_ENV"
      - name: "Generar capturas Flutter SINTETICAS con Roboto legible"
        run: flutter test --update-goldens --dart-define=TALA_VISUAL_CAPTURE=true --reporter=compact test/customer_visual_reference_capture_test.dart
      - name: "Conservar solo capturas PNG sintéticas para revisión"
        uses: actions/upload-artifact@v4
        with:
          name: talaeats-usuarios-v1029-capturas-roboto-legibles
          path: tala-eats-usuarios/app/test/goldens/*_mock_*.png
          if-no-files-found: error
          retention-days: 7
      - name: Pedidos offline e historial sin falsos vacios
        run: flutter test --reporter=compact test/customer_orders_offline_error_test.dart
      - name: Todos los tests Flutter Usuarios
        run: flutter test --reporter=compact
      - name: Backend externo solo GET (diagnostico, no equivalente a E2E)
        timeout-minutes: 2
        run: python3 ../ci/live_readonly_contract_probe.py
      - name: Preparar scaffold nativo Android desde fuentes oficiales
        run: python3 ../ci/bootstrap_android.py --role usuarios
      - name: P0 Manifest, permisos y secretos Android Usuarios
        run: python3 ../../ci/security_android_gate.py --role usuarios
      - name: Compilar Java nativo y Flutter Android debug (efímero, sin publicar)
        timeout-minutes: 12
        run: flutter build apk --debug --no-pub
      - name: No subir ni distribuir APK
        run: |
          test -f build/app/outputs/flutter-apk/app-debug.apk
          echo 'NATIVE_ANDROID_DEBUG_COMPILE_PASS no signing release, no APK artifact, no deploy'

