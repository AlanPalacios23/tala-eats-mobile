name: Tala Eats ADMIN Android QA

on:
  pull_request:
    branches:
      - feat/admin-mobile-mvp-20261020
      - feat/admin-v0.1.1-auth-qa-20261022
      - feat/admin-v0.1.2-signup-connected-apk-20261022
    paths:
      - 'tala-eats-admin/**'
      - '.github/workflows/admin-android-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tala-eats-admin-${{ github.ref }}
  cancel-in-progress: true

jobs:
  admin:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.6'
          channel: stable
          cache: true
      - name: Generar proyecto Android independiente
        working-directory: tala-eats-admin/app
        run: |
          flutter create --platforms=android --project-name talaeats_admin --org com.talaeats .
          # Flutter crea un test demo que intenta instanciar MyApp (no existe).
          # Solo se elimina el archivo generado; nuestros tests se conservan.
          rm -f test/widget_test.dart
      - name: Dependencias
        working-directory: tala-eats-admin/app
        run: flutter pub get
      - name: Static analysis
        working-directory: tala-eats-admin/app
        run: flutter analyze
      - name: Tests
        working-directory: tala-eats-admin/app
        run: flutter test
      - name: Contrato de escrituras SOLO contra staging exacto
        working-directory: tala-eats-admin/app
        run: |
          flutter test test/admin_stage_gate_test.dart \
            --dart-define=TALAEATS_ADMIN_WRITES_ENABLED=true \
            --dart-define=TALAEATS_ADMIN_WRITE_API_BASE_URL=https://admin-stage.example.test/api/v1
      - name: APK debug QA Node RC6 con admin MFA y mutaciones staging
        working-directory: tala-eats-admin/app
        run: |
          flutter build apk --debug \
            --dart-define=TALAEATS_ADMIN_API_BASE_URL=https://talaeats.alan-palacios-dev.com/api/v1 \
            --dart-define=TALAEATS_ADMIN_WRITES_ENABLED=true \
            --dart-define=TALAEATS_ADMIN_WRITE_API_BASE_URL=https://talaeats.alan-palacios-dev.com/api/v1
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: tala-eats-admin-android-debug
          path: tala-eats-admin/app/build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 7
