name: Tala Eats ADMIN Android QA (manual)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tala-eats-admin-${{ github.ref }}
  cancel-in-progress: true

jobs:
  admin:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.6'
          channel: stable
          cache: true
      - name: Generar proyecto Android independiente
        working-directory: tala-eats-admin/app
        run: flutter create --platforms=android --project-name talaeats_admin --org com.talaeats .
      - name: Dependencias
        working-directory: tala-eats-admin/app
        run: flutter pub get
      - name: Static analysis
        working-directory: tala-eats-admin/app
        run: flutter analyze
      - name: Tests
        working-directory: tala-eats-admin/app
        run: flutter test
      - name: APK debug (requiere API segura configurada en dispositivo)
        working-directory: tala-eats-admin/app
        run: flutter build apk --debug
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: tala-eats-admin-android-debug
          path: tala-eats-admin/app/build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 7
