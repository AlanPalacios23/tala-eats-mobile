name: Tala Eats | APK Android (solo manual)

# Ahorro de minutos: NUNCA compilar por push o PR.
# Lanzar solo al agrupar cambios y seleccionar la app deseada.
on:
  # Disparo excepcional para generar las tres APK de prueba solicitadas.
  # Solo esta rama y este archivo marcador pueden iniciar el workflow.
  push:
    branches:
      - feat/node-staging-flutter-3apps-20261020
    paths:
      - ci/trigger-node-staging-apks-20261020.txt
  workflow_dispatch:
    inputs:
      app:
        description: 'Aplicacion a compilar'
        required: true
        default: usuarios
        type: choice
        options:
          - usuarios
          - restaurante
          - repartidor
          - todas
      backend:
        description: 'API para las APK debug'
        required: true
        default: node-staging
        type: choice
        options:
          - node-staging
          - python-production

permissions:
  contents: read

concurrency:
  group: tala-eats-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-apk:
    name: ${{ matrix.rol }} | Analizar, probar y compilar
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    strategy:
      fail-fast: false
      matrix:
        rol: ${{ fromJSON((github.event_name == 'push' || inputs.app == 'todas') && '["usuarios","restaurante","repartidor"]' || format('["{0}"]', inputs.app)) }}
    steps:
      - name: Obtener rama elegida manualmente
        uses: actions/checkout@v4
      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Flutter 3.47.6
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.6'
          channel: stable
          cache: true
      - name: Crear carpeta de diagnóstico
        shell: bash
        run: |
          mkdir -p "tala-eats-${{ matrix.rol }}/app/ci-logs"
          flutter --version | tee "tala-eats-${{ matrix.rol }}/app/ci-logs/flutter-version.log"
          flutter doctor -v | tee "tala-eats-${{ matrix.rol }}/app/ci-logs/flutter-doctor.log"
      - name: Crear Android nativo temporal
        shell: bash
        run: python3 "tala-eats-${{ matrix.rol }}/ci/bootstrap_android.py" --role "${{ matrix.rol }}"
      - name: P0 Seguridad Android y secretos
        shell: bash
        run: python3 ci/security_android_gate.py --role "${{ matrix.rol }}"
      - name: Preparar fuentes open-source de Restaurante
        if: matrix.rol == 'restaurante'
        run: python3 tala-eats-restaurante/ci/prepare_fonts.py
      - name: Instalar dependencias
        shell: bash
        working-directory: tala-eats-${{ matrix.rol }}/app
        run: |
          set -o pipefail
          flutter pub get 2>&1 | tee ci-logs/pub-get.log
      - name: Adaptar Stripe Android (Usuarios)
        if: matrix.rol == 'usuarios'
        run: python3 tala-eats-usuarios/ci/stripe_jvm.py
      - name: Instalar Android NDK con reintentos (Restaurante)
        if: matrix.rol == 'restaurante'
        shell: bash
        run: |
          set -euo pipefail
          sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          ndk_version='28.2.13676358'
          ndk_dir="$sdk_root/ndk/$ndk_version"
          if [ -s "$ndk_dir/source.properties" ]; then
            echo "NDK $ndk_version disponible."
            exit 0
          fi
          for intento in 1 2 3; do
            echo "Instalando NDK $ndk_version: intento $intento/3"
            rm -rf "$ndk_dir"
            if "$sdk_root/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$sdk_root" --install "ndk;$ndk_version" && [ -s "$ndk_dir/source.properties" ]; then
              echo "NDK verificado correctamente."
              exit 0
            fi
            rm -rf "$ndk_dir"
            sleep $((intento * 8))
          done
          echo "::error::No se pudo instalar Android NDK tras tres intentos; revisar estado de SDK Manager."
          exit 1
      - name: Análisis estático
        shell: bash
        working-directory: tala-eats-${{ matrix.rol }}/app
        run: |
          set -o pipefail
          flutter analyze --no-fatal-infos 2>&1 | tee ci-logs/analyze.log
      - name: Ejecutar tests
        shell: bash
        working-directory: tala-eats-${{ matrix.rol }}/app
        run: |
          set -o pipefail
          flutter test --reporter expanded 2>&1 | tee ci-logs/test.log
      - name: Compilar APK debug (sin claves de publicación)
        shell: bash
        working-directory: tala-eats-${{ matrix.rol }}/app
        run: |
          set -euo pipefail
          case '${{ inputs.backend || 'node-staging' }}' in
            node-staging) api_base='https://api-stage-talaeats.alan-palacios-dev.com/api/v1' ;;
            python-production) api_base='https://talaeats.alan-palacios-dev.com/api/v1' ;;
            *) echo "::error::Backend desconocido"; exit 1 ;;
          esac
          echo "API debug: ${{ inputs.backend || 'node-staging' }} ($api_base)"
          case '${{ matrix.rol }}' in
            usuarios) flutter build apk --debug "--dart-define=TALAEATS_API_BASE_URL=$api_base" 2>&1 | tee ci-logs/build.log ;;
            restaurante) flutter build apk --debug "--dart-define=TALA_EATS_API_BASE=$api_base" 2>&1 | tee ci-logs/build.log ;;
            repartidor) flutter build apk --debug "--dart-define=TALA_EATS_API_BASE=$api_base" 2>&1 | tee ci-logs/build.log ;;
          esac
          test -s build/app/outputs/flutter-apk/app-debug.apk
      - name: Adjuntar APK (solo con pruebas y compilación PASS)
        uses: actions/upload-artifact@v4
        with:
          name: TalaEats-${{ matrix.rol }}-${{ inputs.backend || 'node-staging' }}-debug-${{ github.run_number }}
          path: tala-eats-${{ matrix.rol }}/app/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 7
      - name: Guardar logs incluso ante errores
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TalaEats-${{ matrix.rol }}-diagnostico-${{ github.run_number }}
          path: tala-eats-${{ matrix.rol }}/app/ci-logs/
          if-no-files-found: ignore
          retention-days: 7