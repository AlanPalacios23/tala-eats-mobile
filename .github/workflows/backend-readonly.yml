name: Tala Eats | P0 Backend lectura segura

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/backend-readonly.yml'

permissions:
  contents: read

jobs:
  backend-readonly:
    name: P0 backend | Disponibilidad y control anónimo
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Consultas HTTP GET sin credenciales y sin escrituras
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import urllib.error
          import urllib.request
          from urllib.parse import urljoin

          BASE = 'https://talaeats.alan-palacios-dev.com/api/v1/'
          HEADERS = {
              'Accept': 'application/json',
              'User-Agent': 'TalaEats-P0-QA-readonly/1.0',
          }

          def get(path):
              url = urljoin(BASE, path.lstrip('/'))
              req = urllib.request.Request(url, headers=HEADERS, method='GET')
              try:
                  with urllib.request.urlopen(req, timeout=18) as res:
                      return res.status, res.read(128_000)
              except urllib.error.HTTPError as exc:
                  return exc.code, exc.read(4_096)

          status, raw = get('ready')
          assert status == 200, f'/ready: status {status}, expected 200'
          ready = json.loads(raw)
          assert ready.get('ready') is True, '/ready: ready is not true'
          print('PASS: /ready status 200 and ready=true')
          print('Backend version:', str(ready.get('version', 'not disclosed'))[:90])

          status, raw = get('restaurants')
          assert status == 200, f'/restaurants: status {status}, expected 200'
          restaurants = json.loads(raw)
          assert isinstance(restaurants, list), '/restaurants is not a list'
          print('PASS: /restaurants JSON list; number of stores =', len(restaurants))

          for path in ('orders/mine', 'owner/orders', 'driver/dashboard'):
              status, _ = get(path)
              assert status in (401, 403), (
                  f'UNSAFE: anonymous GET /{path} returned {status}; '
                  'expected authentication rejection (401/403)'
              )
              print(f'PASS: anonymous /{path} rejected ({status})')

          print('P0 BACKEND READ-ONLY PASS. No authenticated operations, '
                'orders, payments, GPS updates, or payouts executed.')
          PY
