name: Tala Eats Usuarios - importar imagenes de referencia en rama QA
on:
  push:
    branches:
      - fix/usuarios-login-2fa-single-splash-20261017
    paths:
      - .github/workflows/usuarios-import-qa-images.yml
permissions:
  contents: write
jobs:
  import-user-images:
    if: github.repository == 'AlanPalacios23/tala-eats-mobile'
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Descargar exactamente las dos imagenes compartidas
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p tala-eats-usuarios/app/assets/branding
          curl --fail --location --retry 3 --silent --show-error 'https://d2ol7oe51mr4n9.cloudfront.net/user_3JRVgcDQUmpH7yGXahR2Kecqub1/13265b31-e865-4b89-8cd5-435a54c0912c.png' -o tala-eats-usuarios/app/assets/branding/tala_intro.png
          curl --fail --location --retry 3 --silent --show-error 'https://d2ol7oe51mr4n9.cloudfront.net/user_3JRVgcDQUmpH7yGXahR2Kecqub1/9b6f3033-43af-4963-9514-15803de0fae2.png' -o tala-eats-usuarios/app/assets/branding/login_food.png
          printf '%s  %s\n' '63471d0cb76bb52a5928bbea2274b0d056a44bb5b244061e7292e25a5e48095a' 'tala-eats-usuarios/app/assets/branding/tala_intro.png' '8d549bc60e7e8638279e80f84529cf236fab0e5a0aadd1b350a9c2973ec7b2ff' 'tala-eats-usuarios/app/assets/branding/login_food.png' | sha256sum -c -
      - name: Registrar PNG originales en la rama (sin secretos)
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tala-eats-usuarios/app/assets/branding/login_food.png tala-eats-usuarios/app/assets/branding/tala_intro.png
          git commit -m 'assets(usuarios): integrar imagenes originales aprobadas para login e intro'
          git push origin HEAD:fix/usuarios-login-2fa-single-splash-20261017
