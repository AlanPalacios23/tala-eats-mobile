name: Tala Eats RC9 — Wallet Restaurante y Repartidor (Flutter QA)
on:
  push:
    branches:
      - feat/rc9-mobile-wallet-restaurant-driver-20261028
    paths:
      - 'tala-eats-restaurante/app/lib/**'
      - 'tala-eats-repartidor/app/lib/**'
      - 'tala-eats-restaurante/app/test/**'
      - 'tala-eats-repartidor/app/test/**'
      - '.github/workflows/rc9-mobile-wallet-qa.yml'
  pull_request:
    paths:
      - 'tala-eats-restaurante/app/lib/**'
      - 'tala-eats-repartidor/app/lib/**'
      - 'tala-eats-restaurante/app/test/**'
      - 'tala-eats-repartidor/app/test/**'
      - '.github/workflows/rc9-mobile-wallet-qa.yml'
permissions:
  contents: read
jobs:
  flutter-qa:
    name: ${{ matrix.role }} — Flutter 3.47.6 analyze & test
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - role: Restaurante
            dir: tala-eats-restaurante/app
          - role: Repartidor
            dir: tala-eats-repartidor/app
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.6'
          channel: stable
          cache: true
      - name: Install project deps
        working-directory: ${{ matrix.dir }}
        run: flutter pub get
      - name: Analyze app
        working-directory: ${{ matrix.dir }}
        run: flutter analyze --no-fatal-infos
      - name: Confirm repository branding font assets (release blocker)
        if: matrix.role == 'Restaurante'
        run: |
          python3 - <<'PY'
          from pathlib import Path
          base=Path('tala-eats-restaurante/app/assets/fonts')
          expected=['Figtree_400Regular.ttf','Figtree_500Medium.ttf',
            'Figtree_600SemiBold.ttf','Figtree_700Bold.ttf',
            'Figtree_800ExtraBold.ttf',
            'BricolageGrotesque_600SemiBold.ttf',
            'BricolageGrotesque_700Bold.ttf',
            'BricolageGrotesque_800ExtraBold.ttf']
          missing=[n for n in expected if not (base/n).is_file()]
          if missing: print('RESTAURANTE_RELEASE_FONT_ASSETS_MISSING:',','.join(missing))
          else: print('RESTAURANTE_RELEASE_FONT_ASSETS=PASS')
          PY
      - name: Temporary font-free widget QA (does NOT certify branded release)
        if: matrix.role == 'Restaurante'
        working-directory: ${{ matrix.dir }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('pubspec.yaml')
          text=p.read_text()
          marker='  fonts:\n'
          if marker not in text: raise SystemExit('Unexpected pubspec asset manifest')
          p.write_text(text.split(marker,1)[0]+'\n')
          print('SYNTHETIC_FONT_FREE_TESTS_ONLY — original source unchanged in Git')
          PY
          flutter pub get
          flutter test --reporter expanded
      - name: Run actual Repartidor widget/data tests
        if: matrix.role == 'Repartidor'
        working-directory: ${{ matrix.dir }}
        run: flutter test --reporter expanded
      - name: Validate money launch flags are OFF by default
        run: |
          grep -q 'defaultValue: false' tala-eats-restaurante/app/lib/data/withdrawal_gateway.dart
          grep -q 'defaultValue: false' tala-eats-repartidor/app/lib/data/driver_treasury_gateway.dart
          grep -q 'server_allows_requests' tala-eats-repartidor/app/lib/data/driver_treasury_gateway.dart
